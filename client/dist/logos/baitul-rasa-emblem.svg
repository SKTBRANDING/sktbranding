<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e1c" />
      <stop offset="50%" stop-color="#0f3d26" />
      <stop offset="100%" stop-color="#072415" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED58E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <!-- Outer Emblem Shield / Pill -->
  <rect x="10" y="10" width="380" height="140" rx="36" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.35))" />
  
  <!-- Inner Delicate Gold Inset Border -->
  <rect x="18" y="18" width="364" height="124" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="none" opacity="0.85" />

  <!-- RESTAURANT Header -->
  <text x="200" y="46" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="13" font-weight="700" letter-spacing="6" fill="#F4E0A5">
    RESTAURANT
  </text>

  <!-- Divider flourishes -->
  <path d="M 90 53 Q 200 50 310 53" stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Baitul Rasa Main Title -->
  <text x="200" y="98" text-anchor="middle" font-family="'Cinzel Decorative', 'Playfair Display', 'Times New Roman', serif" font-size="34" font-weight="900" letter-spacing="1" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">
    Baitul Rasa
  </text>

  <!-- Subtitle / Tagline -->
  <text x="200" y="125" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="600" letter-spacing="3" fill="#D4AF37">
    TASTE OF HERITAGE • ESTD 1990
  </text>
</svg>